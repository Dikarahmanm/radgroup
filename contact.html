<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Contact - RAD Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
    <script src="js/components.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        .hover-link:hover {
            color: #4bcdc9;
        }

        .social-icon:hover {
            transform: translateY(-4px);
        }

        .page-content {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .page-content.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .map-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 0.5rem;
            border: 1px solid #f3f4f6;
        }

        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .initial-load-header {
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            animation: slideInHeader 0.6s ease-in-out forwards;
        }

        @keyframes slideInHeader {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .initial-load-main {
            opacity: 0;
            transform: translateY(20px);
            animation: slideInMain 0.8s ease-in-out 0.2s forwards;
        }

        @keyframes slideInMain {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .initial-load-footer {
            opacity: 0;
            transform: translateY(20px);
            animation: slideInFooter 0.8s ease-in-out 0.4s forwards;
        }

        @keyframes slideInFooter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-link {
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .nav-link:hover {
            transform: scale(1.05);
        }

        .nav-underline {
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #4bcdc9;
            transition: width 0.3s ease;
        }

        .nav-link:hover .nav-underline {
            width: 100%;
        }

        #mobile-menu.active {
            display: block;
        }
    </style>
</head>

<body class="bg-white text-gray-900">
    <!-- Header -->
    <div id="header"></div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-28 pb-12 page-content">
        <section class="bg-white p-8 rounded-lg border border-gray-100">
            <p class="text-xs uppercase text-gray-400 tracking-widest mb-3">GET IN TOUCH</p>
            <h1 class="text-3xl font-light leading-tight">Contact <strong class="font-bold">RAD</strong> Studio</h1>
            <p class="mt-4 text-base font-light leading-relaxed max-w-md text-gray-600">
                Reach out to discuss your project or learn more about our creative solutions.
            </p>
            <form class="mt-6 max-w-lg space-y-4">
                <div>
                    <label for="name" class="text-sm text-gray-600">Name</label>
                    <input type="text" id="name"
                        class="w-full px-4 py-2 mt-1 text-sm bg-gray-100 text-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-300" />
                </div>
                <div>
                    <label for="email" class="text-sm text-gray-600">Email</label>
                    <input type="email" id="email"
                        class="w-full px-4 py-2 mt-1 text-sm bg-gray-100 text-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-300" />
                </div>
                <div>
                    <label for="message" class="text-sm text-gray-600">Message</label>
                    <textarea id="message" rows="4"
                        class="w-full px-4 py-2 mt-1 text-sm bg-gray-100 text-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-300"></textarea>
                </div>
                <button type="submit"
                    class="px-6 py-2 text-sm bg-teal-100 text-teal-800 rounded-md hover:bg-teal-200 transition-colors">Send
                    Message</button>
            </form>
        </section>

        <!-- Map Section -->
        <section class="mt-12 bg-white p-8 rounded-lg border border-gray-100">
            <p class="text-xs uppercase text-gray-400 tracking-widest mb-3">OUR LOCATION</p>
            <h2 class="text-2xl font-light leading-tight">Visit Us in <strong class="font-bold">Purwakarta</strong></h2>
            <p class="mt-4 text-base font-light leading-relaxed max-w-md text-gray-600">
                Find RAD Studio in the heart of Purwakarta, Indonesia, where creativity meets innovation.
            </p>
            <div class="mt-6 map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.641447769257!2d106.63711831476998!3d-6.178306995523114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f6c3b7e9b7c5%3A0x4b8b7b7b7b7b7b7b!2sPurwakarta%2C%20Banten%2C%20Indonesia!5e0!3m2!1sen!2sus!4v1635781234567!5m2!1sen!2sus"
                    allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://www.google.com/maps/place/Purwakarta,+Banten,+Indonesia" target="_blank"
                class="mt-4 inline-block text-sm text-gray-600 hover-link transition-colors">View on Google Maps</a>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
</body>

</html>
